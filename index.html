<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Bin Packer — Pack Master</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #242432;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --text: #e0e0f0;
      --text-muted: #888;
      --border: #333348;
      --success: #4ade80;
      --error: #f87171;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      padding: 11px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hint {
      margin-left: auto;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 300px;
      min-width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 14px;
      gap: 12px;
    }

    .section {
      background: var(--surface2);
      border-radius: 8px;
      padding: 12px;
      border: 1px solid var(--border);
    }

    .section h3 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }

    label {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 3px;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 0.82rem;
    }

    input[type="color"] {
      width: 100%;
      height: 30px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 4px;
      cursor: pointer;
    }

    input:focus { outline: none; border-color: var(--accent); }

    .btn {
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:hover { opacity: 0.82; }
    .btn:active { transform: scale(0.97); }

    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--error); color: #fff; padding: 3px 8px; font-size: 0.72rem; }

    .actions { display: flex; gap: 8px; }
    .actions .btn { flex: 1; }

    /* ---- Item list ---- */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .item-entry {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 8px;
      background: var(--bg);
      border-radius: 5px;
      border: 1px solid var(--border);
      font-size: 0.78rem;
      min-width: 0;
    }

    /* ---- Pagination ---- */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      gap: 6px;
    }

    .pagination .btn-page {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .pagination .btn-page:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .pagination .page-info {
      font-size: 0.72rem;
      color: var(--text-muted);
      flex: 1;
      text-align: center;
    }

    .dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
    .item-info { flex: 1; overflow: hidden; }
    .item-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-dims { color: var(--text-muted); font-size: 0.68rem; }
    .status-ok  { color: var(--success); font-size: 0.72rem; font-weight: 700; }
    .status-no  { color: var(--error);   font-size: 0.72rem; font-weight: 700; }

    /* ---- Stats ---- */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

    .stat-card {
      background: var(--bg);
      border-radius: 6px;
      padding: 9px;
      text-align: center;
      border: 1px solid var(--border);
    }

    .stat-value { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.68rem; color: var(--text-muted); }
    .span2 { grid-column: span 2; }

    /* ---- Canvas ---- */
    .canvas-area {
      flex: 1;
      position: relative;
      background: radial-gradient(ellipse at 50% 60%, #1a1a2e 0%, #0f0f13 100%);
      overflow: hidden;
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }

    .canvas-tip {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: var(--text-muted);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.7rem;
      pointer-events: none;
      white-space: nowrap;
    }

    .empty { text-align: center; color: var(--text-muted); font-size: 0.78rem; padding: 14px 0; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    @media (max-width: 580px) {
      .main { flex-direction: column; }
      .sidebar { width: 100%; max-height: 55vh; }
      .hint { display: none; }
    }
  </style>
</head>
<body>

<header>
  <span style="font-size:1.3rem">📦</span>
  <h1>3D Bin Packer — Pack Master</h1>
  <span class="hint">Drag to rotate · Scroll to zoom</span>
</header>

<div class="main">
  <div class="sidebar">

    <!-- Container -->
    <div class="section">
      <h3>Container</h3>
      <div class="grid3">
        <div><label>Width</label><input type="number" id="binW" value="10" min="1" max="200"></div>
        <div><label>Height</label><input type="number" id="binH" value="10" min="1" max="200"></div>
        <div><label>Depth</label><input type="number" id="binD" value="10" min="1" max="200"></div>
      </div>
    </div>

    <!-- Add item -->
    <div class="section">
      <h3>Add Item</h3>
      <div style="margin-bottom:7px">
        <label>Name</label>
        <input type="text" id="iName" value="Box 1" placeholder="Item name">
      </div>
      <div class="grid3" style="margin-bottom:7px">
        <div><label>W</label><input type="number" id="iW" value="2" min="0.1" step="0.5"></div>
        <div><label>H</label><input type="number" id="iH" value="2" min="0.1" step="0.5"></div>
        <div><label>D</label><input type="number" id="iD" value="2" min="0.1" step="0.5"></div>
      </div>
      <div style="margin-bottom:8px">
        <label>Color</label>
        <input type="color" id="iColor" value="#6c63ff">
      </div>
      <button class="btn btn-primary" onclick="addItem()">+ Add Item</button>
    </div>

    <!-- Item list -->
    <div class="section">
      <h3>Items (<span id="itemCount">0</span>)</h3>
      <div class="item-list" id="itemList">
        <div class="empty">No items added yet</div>
      </div>
      <div class="pagination" id="pagination" style="display:none">
        <button class="btn-page" id="btnPrev" onclick="changePage(-1)" disabled>‹ Prev</button>
        <span class="page-info" id="pageInfo"></span>
        <button class="btn-page" id="btnNext" onclick="changePage(1)">Next ›</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="section" id="statsSection" style="display:none">
      <h3>Statistics</h3>
      <div class="stats">
        <div class="stat-card"><div class="stat-value" id="sPacked">0</div><div class="stat-label">Packed</div></div>
        <div class="stat-card"><div class="stat-value" id="sUnpacked">0</div><div class="stat-label">Unpacked</div></div>
        <div class="stat-card span2"><div class="stat-value" id="sUtil">0%</div><div class="stat-label">Volume Utilization</div></div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" onclick="pack()">▶ Pack</button>
      <button class="btn btn-secondary" onclick="resetPack()">↺ Reset</button>
    </div>

  </div>

  <div class="canvas-area">
    <canvas id="c"></canvas>
    <div class="canvas-tip">🖱 Drag to rotate · Scroll to zoom · Right-drag to pan</div>
  </div>
</div>

<!-- Three.js via importmap (ES modules) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
  camera.position.set(20, 16, 20);

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance = 2;
  controls.maxDistance = 500;

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(20, 30, 20);
  sun.castShadow = true;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x8888ff, 0.25);
  fill.position.set(-10, -5, -10);
  scene.add(fill);

  // Grid
  const grid = new THREE.GridHelper(200, 40, 0x2a2a40, 0x1e1e30);
  grid.position.y = -0.02;
  scene.add(grid);

  let containerGroup = new THREE.Group();
  scene.add(containerGroup);
  let itemGroup = new THREE.Group();
  scene.add(itemGroup);

  function drawContainer(w, h, d) {
    containerGroup.clear();
    const edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d));
    const line = new THREE.LineSegments(
      edges,
      new THREE.LineBasicMaterial({ color: 0x6c63ff, transparent: true, opacity: 0.75 })
    );
    line.position.set(w / 2, h / 2, d / 2);
    containerGroup.add(line);

    // semi-transparent faces
    const faceGeo = new THREE.BoxGeometry(w, h, d);
    const faceMat = new THREE.MeshLambertMaterial({
      color: 0x6c63ff,
      transparent: true,
      opacity: 0.04,
      side: THREE.BackSide
    });
    const face = new THREE.Mesh(faceGeo, faceMat);
    face.position.copy(line.position);
    containerGroup.add(face);

    const maxDim = Math.max(w, h, d);
    camera.position.set(maxDim * 1.9, maxDim * 1.5, maxDim * 1.9);
    controls.target.set(w / 2, h / 2, d / 2);
    controls.update();
  }

  function drawItems(items) {
    itemGroup.clear();
    const ITEM_GAP = 0.06; // visual gap between adjacent items
    const MIN_DIM  = 0.01; // prevents degenerate zero-size geometry
    for (const item of items) {
      const geo = new THREE.BoxGeometry(
        Math.max(item.w - ITEM_GAP, MIN_DIM),
        Math.max(item.h - ITEM_GAP, MIN_DIM),
        Math.max(item.d - ITEM_GAP, MIN_DIM)
      );
      const mat = new THREE.MeshLambertMaterial({
        color: new THREE.Color(item.color),
        transparent: true,
        opacity: 0.88
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(item.x + item.w / 2, item.y + item.h / 2, item.z + item.d / 2);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      itemGroup.add(mesh);

      // edge outline
      const eLine = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 })
      );
      eLine.position.copy(mesh.position);
      itemGroup.add(eLine);
    }
  }

  function resize() {
    const p = canvas.parentElement;
    const w = p.clientWidth, h = p.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  window.addEventListener('resize', resize);
  resize();
  drawContainer(10, 10, 10);

  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();

  // Expose API to non-module script
  window._three = { drawContainer, drawItems };
</script>

<script>
  // ---- App State ----
  let items = [];
  let uid = 1;
  let currentPage = 1;
  const ITEMS_PER_PAGE = 5;

  // Preset colours for auto-assignment
  const COLOURS = [
    '#6c63ff','#ff6584','#4ade80','#fbbf24','#60a5fa',
    '#f472b6','#34d399','#fb923c','#a78bfa','#38bdf8'
  ];

  function addItem() {
    const name  = document.getElementById('iName').value.trim() || 'Box';
    const w     = Math.max(0.1, parseFloat(document.getElementById('iW').value) || 1);
    const h     = Math.max(0.1, parseFloat(document.getElementById('iH').value) || 1);
    const d     = Math.max(0.1, parseFloat(document.getElementById('iD').value) || 1);
    const color = document.getElementById('iColor').value;

    items.push({ id: uid++, name, w, h, d, color, packed: null });
    currentPage = Math.ceil(items.length / ITEMS_PER_PAGE);
    renderList();

    // auto-increment name number
    const m = name.match(/^(.*?)(\d+)$/);
    if (m) document.getElementById('iName').value = m[1] + (parseInt(m[2]) + 1);

    // rotate colour
    const idx = items.length % COLOURS.length;
    document.getElementById('iColor').value = COLOURS[idx];
  }

  function removeItem(id) {
    items = items.filter(i => i.id !== id);
    renderList();
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }

  function renderList() {
    document.getElementById('itemCount').textContent = items.length;
    const el = document.getElementById('itemList');
    const paginationEl = document.getElementById('pagination');

    if (items.length === 0) {
      el.innerHTML = '<div class="empty">No items added yet</div>';
      paginationEl.style.display = 'none';
      return;
    }

    const totalPages = Math.ceil(items.length / ITEMS_PER_PAGE);
    if (currentPage > totalPages) currentPage = totalPages;

    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const pageItems = items.slice(start, start + ITEMS_PER_PAGE);

    el.innerHTML = pageItems.map(item => `
      <div class="item-entry">
        <div class="dot" style="background:${item.color}"></div>
        <div class="item-info">
          <div class="item-name">${escapeHtml(item.name)}</div>
          <div class="item-dims">${item.w} × ${item.h} × ${item.d}</div>
        </div>
        ${item.packed === true  ? '<span class="status-ok">✓</span>' :
          item.packed === false ? '<span class="status-no">✗</span>' : ''}
        <button class="btn btn-danger" onclick="removeItem(${item.id})">×</button>
      </div>
    `).join('');

    if (totalPages > 1) {
      paginationEl.style.display = 'flex';
      document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
      document.getElementById('btnPrev').disabled = currentPage === 1;
      document.getElementById('btnNext').disabled = currentPage === totalPages;
    } else {
      paginationEl.style.display = 'none';
    }
  }

  function changePage(delta) {
    const totalPages = Math.ceil(items.length / ITEMS_PER_PAGE);
    currentPage = Math.max(1, Math.min(currentPage + delta, totalPages));
    renderList();
  }

  // ---- 3D Bin Packing: Guillotine algorithm ----
  const vol = item => item.w * item.h * item.d;

  function packItems(binW, binH, binD, src) {
    // Sort by volume descending (largest first)
    const sorted = [...src].sort((a, b) => vol(b) - vol(a));

    // Free spaces — start with the whole bin
    let spaces = [{ x: 0, y: 0, z: 0, w: binW, h: binH, d: binD }];
    const packed = [], unpacked = [];

    for (const item of sorted) {
      let placed = false;
      for (let i = 0; i < spaces.length; i++) {
        const s = spaces[i];
        if (item.w <= s.w && item.h <= s.h && item.d <= s.d) {
          packed.push({ ...item, x: s.x, y: s.y, z: s.z });

          // Guillotine split: three sub-spaces (top, right, back)
          const subs = [
            { x: s.x,          y: s.y + item.h, z: s.z,          w: s.w,          h: s.h - item.h, d: s.d          },
            { x: s.x + item.w, y: s.y,          z: s.z,          w: s.w - item.w, h: item.h,       d: s.d          },
            { x: s.x,          y: s.y,          z: s.z + item.d, w: item.w,       h: item.h,       d: s.d - item.d }
          ].filter(sp => sp.w > 0 && sp.h > 0 && sp.d > 0);

          spaces.splice(i, 1, ...subs);
          placed = true;
          break;
        }
      }
      if (!placed) unpacked.push(item);
    }
    return { packed, unpacked };
  }

  function pack() {
    if (items.length === 0) { alert('Add at least one item first.'); return; }

    const binW = Math.max(0.1, parseFloat(document.getElementById('binW').value) || 10);
    const binH = Math.max(0.1, parseFloat(document.getElementById('binH').value) || 10);
    const binD = Math.max(0.1, parseFloat(document.getElementById('binD').value) || 10);

    const { packed, unpacked } = packItems(binW, binH, binD, items);

    const packedIds = new Set(packed.map(i => i.id));
    items.forEach(item => { item.packed = packedIds.has(item.id); });
    renderList();

    if (window._three) {
      window._three.drawContainer(binW, binH, binD);
      window._three.drawItems(packed);
    }

    const binVol  = binW * binH * binD;
    const usedVol = packed.reduce((s, i) => s + vol(i), 0);
    const util    = binVol > 0 ? Math.round((usedVol / binVol) * 100) : 0;

    document.getElementById('sPacked').textContent   = packed.length;
    document.getElementById('sUnpacked').textContent = unpacked.length;
    document.getElementById('sUtil').textContent     = util + '%';
    document.getElementById('statsSection').style.display = 'block';
  }

  function resetPack() {
    items.forEach(i => { i.packed = null; });
    renderList();
    document.getElementById('statsSection').style.display = 'none';

    const binW = Math.max(0.1, parseFloat(document.getElementById('binW').value) || 10);
    const binH = Math.max(0.1, parseFloat(document.getElementById('binH').value) || 10);
    const binD = Math.max(0.1, parseFloat(document.getElementById('binD').value) || 10);

    if (window._three) {
      window._three.drawContainer(binW, binH, binD);
      window._three.drawItems([]);
    }
  }

  // Redraw container outline when dimensions change
  ['binW', 'binH', 'binD'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      const w = Math.max(0.1, parseFloat(document.getElementById('binW').value) || 10);
      const h = Math.max(0.1, parseFloat(document.getElementById('binH').value) || 10);
      const d = Math.max(0.1, parseFloat(document.getElementById('binD').value) || 10);
      if (window._three) window._three.drawContainer(w, h, d);
    });
  });

  // Allow Enter key to add item
  ['iName','iW','iH','iD'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') addItem();
    });
  });

  // Pre-load demo items
  (function seedDemo() {
    const demos = [
      { name: 'Box 1', w: 4, h: 3, d: 3, color: '#6c63ff' },
      { name: 'Box 2', w: 3, h: 4, d: 2, color: '#ff6584' },
      { name: 'Box 3', w: 2, h: 3, d: 4, color: '#4ade80' },
      { name: 'Box 4', w: 3, h: 2, d: 3, color: '#fbbf24' },
      { name: 'Box 5', w: 2, h: 2, d: 2, color: '#60a5fa' },
    ];
    demos.forEach(d => items.push({ id: uid++, ...d, packed: null }));
    renderList();
  })();
</script>

</body>
</html>
